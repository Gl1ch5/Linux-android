name: build-apk

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Версия из тега или коммита
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Распаковать keystore (только для тегов)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Имена файлов
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/LinuxDesk-${VERSION_NAME}-debug.apk"
          if [[ "$GITHUB_REF" == refs/tags/v* && -n "$KEYSTORE_B64" ]]; then
            cp app/build/outputs/apk/release/app-release.apk "out/LinuxDesk-${VERSION_NAME}-release.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linuxdesk-apk
          path: out/*.apk
          retention-days: 14

      - name: Публикация релиза (только подписанный release)
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 != ''
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
